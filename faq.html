<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAQ - Tech Nova</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./css/faq.css">
</head>

<body>

<div class="faq-wrapper">

  <h1>Tech Nova FAQ</h1>

  <!-- Search -->
  <div class="search-box">
    <i class="fas fa-search"></i>
    <input type="text" id="search" placeholder="Search your question...">
  </div>

  <!-- FAQ ITEMS -->

  <div class="faq-item">
    <button class="faq-question">
      هل المنتجات عليها ضمان؟
      <span>+</span>
    </button>
    <div class="faq-answer">
      نعم، جميع منتجات Tech Nova تأتي بضمان رسمي ضد عيوب الصناعة.
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question">
      مدة الشحن قد إيه؟
      <span>+</span>
    </button>
    <div class="faq-answer">
      الشحن داخل مصر يستغرق من 2 إلى 5 أيام حسب المحافظة.
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question">
      طرق الدفع المتاحة؟
      <span>+</span>
    </button>
    <div class="faq-answer">
      كاش عند الاستلام أو الدفع الإلكتروني (Visa / MasterCard).
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question">
      هل يمكن استرجاع المنتج؟
      <span>+</span>
    </button>
    <div class="faq-answer">
      نعم خلال 14 يوم بشرط أن يكون المنتج بحالته الأصلية.
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question">
      هل يوجد دعم فني؟
      <span>+</span>
    </button>
    <div class="faq-answer">
      نعم، فريق الدعم متاح لمساعدتك في أي مشكلة تقنية.
    </div>
  </div>

</div>

   <script src="./js/faq.js"></script>

</body>
</html>
