<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        :root {
            --primary-color: #005ad9;
            --text-color: #000000;
            --gray-text: #7d8184;
            --border-color: #e0e0e0;
            --bg-light: #ffffff;
            --shadow: 0px 1px 13px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fcfcfc;
            color: var(--text-color);
        }

        .container {
            max-width: 1170px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* --- أيقونة السلة والبادج في النبار --- */
        .Shoping_cart {
            position: relative;
            display: inline-block;
        }

        .Shoping_cart a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 24px;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--primary-color);
            color: white;
            font-size: 12px;
            font-weight: 600;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- التحكم في ظهور وإغلاق صفحة السلة --- */
        .cart-page-popup {
            transition: all 0.4s ease;
            opacity: 1;
            display: block;
            padding: 20px 0;
        }

        .cart-page-popup.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .cart-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-popup-x {
            background: none;
            border: none;
            font-size: 35px;
            font-weight: 300;
            cursor: pointer;
            color: #333;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-popup-x:hover {
            color: var(--primary-color);
        }

        /* --- Breadcrumb --- */
        .breadcrumb {
            font-size: 14px;
            color: var(--gray-text);
        }

        .breadcrumb a {
            text-decoration: none;
            color: var(--gray-text);
        }

        .breadcrumb span {
            color: var(--text-color);
        }

        /* --- جدول السلة --- */
        .cart-table-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .cart-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 20px;
        }

        .cart-table th {
            text-align: left;
            padding: 20px 24px;
            font-weight: 500;
            background-color: var(--bg-light);
            box-shadow: var(--shadow);
            border-radius: 4px;
        }

        .cart-table th:nth-child(1), .cart-table td:nth-child(1) { text-align: left; }
        .cart-table th:nth-child(2), .cart-table td:nth-child(2) { text-align: left; padding-left: 40px; }
        .cart-table th:nth-child(3), .cart-table td:nth-child(3) { text-align: center; }
        .cart-table th:nth-child(4), .cart-table td:nth-child(4) { text-align: right; padding-right: 40px; }

        .cart-row td {
            background-color: var(--bg-light);
            padding: 20px 24px;
            vertical-align: middle;
            box-shadow: var(--shadow);
        }

        .cart-row td:first-child { border-radius: 4px 0 0 4px; }
        .cart-row td:last-child { border-radius: 0 4px 4px 0; }

        .product-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .image-wrapper {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .remove-btn {
            position: absolute;
            top: -5px;
            left: -5px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .cart-row:hover .remove-btn {
            opacity: 1;
        }

        /* --- أزرار التحكم بالكمية المخصصة (+ و -) --- */
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--border-color);
            border-radius: 4px;
            width: 90px;
            margin: 0 auto;
            overflow: hidden;
        }

        .qty-btn {
            background: none;
            border: none;
            width: 30px;
            height: 35px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background-color: #f0f0f0;
        }

        .quantity-input {
            width: 30px;
            border: none;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: transparent;
        }

        .quantity-input::-webkit-outer-spin-button,
        .quantity-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* --- الأزرار --- */
        .btn {
            padding: 16px 48px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        .btn a {
            color: #ffffff;
            text-decoration: none;
        }
        .btn-outline {
            background-color: transparent;
            border: 1px solid rgba(0,0,0,0.5);
            color: var(--text-color);
        }

        .btn-outline:hover { background-color: rgba(0,0,0,0.05); }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #004bb5; }
        .full-width { width: 100%; }

        .cart-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 60px;
        }

        /* --- الفوتر والإجمالي --- */
        .cart-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: wrap;
        }

        .cart-total-box {
            border: 1.5px solid var(--text-color);
            border-radius: 4px;
            padding: 32px 24px;
            width: 470px;
            background-color: var(--bg-light);
            margin-left: auto;
        }

        .cart-total-box h3 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin: 15px 0;
        }

        .cart-total-box hr {
            border: none;
            border-top: 1px solid var(--border-color);
        }

        .main-total { margin-bottom: 30px; }

        /* شاشات الموبايل */
        @media (max-width: 768px) {
            .cart-bottom { flex-direction: column; }
            .cart-total-box { width: 100%; max-width: 100%; }
            .cart-actions { flex-direction: column; gap: 15px; }
            .cart-actions .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="cart-page-section" class="cart-page-popup">
        <div class="container">
            
            <div class="cart-header-actions">
                <nav class="breadcrumb">
                    <a href="index.html">Home</a> / <span>Cart</span>
                </nav>
                <a href="index.html" id="close-cart-btn" class="close-popup-x" style="text-decoration: none;">×</a>
            </div>

            <div class="cart-table-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items-container">
                        </tbody>
                </table>
            </div>

            <div class="cart-actions">
                <button class="btn btn-outline" onclick="window.location.href='index.html'">Return To Shop</button>
                <button class="btn btn-outline" id="update-cart-btn">Update Cart</button>
            </div>

            <div class="cart-bottom">
                <div></div>

                <div class="cart-total-box">
                    <h3>Cart Total</h3>
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal">0 EGP</span>
                    </div>
                    <hr>
                    <div class="total-row">
                        <span>Shipping:</span>
                        <span id="shipping-cost">Free</span>
                    </div>
                    <hr>
                    <div class="total-row main-total">
                        <span>Total:</span>
                        <span id="cart-final-total">0 EGP</span>
                    </div>
                     <button class="btn btn-primary full-width"><a href="checkout.html">Proceed to checkout</a> </button>
                </div>
            </div>
        </div>
    </div>

<script >
    document.addEventListener("DOMContentLoaded", () => {
    const cartContainer = document.getElementById("cart-items-container");
    const subtotalElement = document.getElementById("cart-subtotal");
    const finalTotalElement = document.getElementById("cart-final-total");
    const updateCartBtn = document.getElementById("update-cart-btn");

    // 1. دالة جلب وعرض البيانات من الـ LocalStorage
    function displayCartItems() {
        let cart = JSON.parse(localStorage.getItem("tech_nova_cart")) || [];
        cartContainer.innerHTML = "";

        if (cart.length === 0) {
            cartContainer.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 40px; color: #7d8184;">Your shopping cart is currently empty.</td></tr>`;
            if (subtotalElement) subtotalElement.textContent = "0 EGP";
            if (finalTotalElement) finalTotalElement.textContent = "0 EGP";
            return;
        }

        cart.forEach(item => {
            const itemSubtotal = item.price * item.quantity;
            const rowHTML = `
                <tr class="cart-row" data-id="${item.id}" data-price="${item.price}">
                    <td class="product-cell">
                        <div class="product-info">
                            <div class="image-wrapper">
                                <img src="${item.image}" alt="${item.title}">
                                <button class="remove-btn">×</button>
                            </div>
                            <span class="product-name">${item.title}</span>
                        </div>
                    </td>
                    <td class="price-cell">${item.price} EGP</td>
                    <td>
                        <div class="quantity-control">
                            <button class="qty-btn minus">-</button>
                            <input type="number" class="quantity-input" value="${item.quantity}" min="1" readonly>
                            <button class="qty-btn plus">+</button>
                        </div>
                    </td>
                    <td class="subtotal-cell">${itemSubtotal} EGP</td>
                </tr>
            `;
            cartContainer.innerHTML += rowHTML;
        });

        updateCartTotals();
    }

    // 2. دالة حساب الإجماليات وتحديث الحساب المالي
    function updateCartTotals() {
        let overallSubtotal = 0;
        const cartRows = document.querySelectorAll(".cart-row");

        cartRows.forEach(row => {
            const price = parseFloat(row.getAttribute("data-price"));
            const quantityInput = row.querySelector(".quantity-input");
            let quantity = parseInt(quantityInput.value);

            const rowSubtotal = price * quantity;
            row.querySelector(".subtotal-cell").textContent = `${rowSubtotal} EGP`;
            overallSubtotal += rowSubtotal;
        });

        if (subtotalElement) subtotalElement.textContent = `${overallSubtotal} EGP`;
        if (finalTotalElement) finalTotalElement.textContent = `${overallSubtotal} EGP`;
    }

    // 3. تحديث الكاش (LocalStorage) عند تعديل الكميات
    function saveCartState() {
        let cart = [];
        const cartRows = document.querySelectorAll(".cart-row");

        cartRows.forEach(row => {
            const id = row.getAttribute("data-id");
            const title = row.querySelector(".product-name").textContent;
            const price = parseFloat(row.getAttribute("data-price"));
            const image = row.querySelector(".image-wrapper img").getAttribute("src");
            const quantity = parseInt(row.querySelector(".quantity-input").value);

            cart.push({ id, title, price, image, quantity });
        });

        localStorage.setItem("tech_nova_cart", JSON.stringify(cart));
        updateCartTotals();
    }

    // 4. معالجة الأحداث لـ (+ , - , حذف) بالـ Event Delegation
    if (cartContainer) {
        cartContainer.addEventListener("click", (e) => {
            const row = e.target.closest(".cart-row");
            if (!row) return;

            const quantityInput = row.querySelector(".quantity-input");
            let currentQty = parseInt(quantityInput.value);

            // زيادة الكمية (+)
            if (e.target.classList.contains("plus")) {
                quantityInput.value = currentQty + 1;
                saveCartState();
            }

            // تقليل الكمية (-)
            if (e.target.classList.contains("minus")) {
                if (currentQty > 1) {
                    quantityInput.value = currentQty - 1;
                    saveCartState();
                }
            }

            // حذف المنتج بالكامل (X)
            if (e.target.classList.contains("remove-btn")) {
                row.style.opacity = "0";
                row.style.transform = "scale(0.9)";
                row.style.transition = "all 0.3s ease";
                setTimeout(() => {
                    row.remove();
                    saveCartState();
                    // في حال حُذفت كل الصفوف
                    if(document.querySelectorAll(".cart-row").length === 0) {
                        displayCartItems();
                    }
                }, 300);
            }
        });
    }

    // زر تحديث السلة اليدوي كحماية إضافية للبيانات
    if (updateCartBtn) {
        updateCartBtn.addEventListener("click", () => {
            saveCartState();
            alert("Cart updated successfully!");
        });
    }

    // تشغيل جلب وعرض البيانات فور تحميل الصفحة
    displayCartItems();
});
</script>

</script>
</body>
</html>
